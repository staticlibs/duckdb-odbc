name: Vendor
on:
  workflow_call:
    inputs:
      duckdb-sha:
        description: 'Vendor Specific DuckDB SHA'
        required: false
        default: ''
        type: 'string'
  workflow_dispatch:
    inputs:
      duckdb-sha:
        description: 'Vendor Specific DuckDB SHA'
        required: false
        default: ''
        type: 'string'

jobs:
  vendor:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      did_vendor: ${{ steps.vendor.outputs.vendor }}

    name: "Update Vendored Sources"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/checkout@v4
        with:
          repository: duckdb/duckdb
          path: .git/duckdb
          fetch-depth: 0

      - name: Get commit SHA
        if: ${{ inputs.duckdb-sha != '' }}
        run: |
          cd .git/duckdb && git checkout ${{ inputs.duckdb-sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vendor sources
        id: vendor
        run: |
          export REV=$(cd .git/duckdb && git rev-parse --short HEAD && cd ../..)
          echo "Updating vendored DuckDB sources to $REV"
          git config --global user.email "github_bot@duckdblabs.com"
          git config --global user.name "DuckDB Labs GitHub Bot"
          git checkout vendoring
          git rm -rf src/duckdb
          python vendor.py --duckdb .git/duckdb
          git add src/duckdb CMakeLists.txt
          rm -rf .git/duckdb
          git commit -m "Update vendored DuckDB sources to $REV"
          git push -f --dry-run origin vendoring
          # Check if ahead of upstream branch
          # If yes, set a step output
          if [ $(git rev-list HEAD...origin/main --count) -gt 0 ]; then
            # Avoid set-output, it's deprecated
            echo "vendor=$REV" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the changes
        if: steps.vendor.outputs.vendor != '' && github.event_name != 'pull_request'
        run: |
          git push -f origin vendoring

      - name: create a PR
        if: steps.vendor.outputs.vendor != '' && github.event_name != 'pull_request'
        run: |
            export MSG="$(git show -s --format=%s)"
            # Store the PAT in a file that can be accessed by the
            # GitHub CLI.
            echo "${{ secrets.GH_TOKEN }}" > token.txt
            # Authorize GitHub CLI for the current repository and
            # create a pull-requests containing the updates.
            gh auth login --with-token < token.txt
            # This command will fail if PR already exists on vendoring branch
            gh pr create \
             --title "${MSG}" \
             --body "Changes:" \
             --head "vendoring" \
             --base "main" || true
            # Write existing body test to a file
            gh pr view vendoring --json body --jq '.body' > body.txt
            # Append change details to the body file
            echo " - [duckdb/duckdb#${{ steps.vendor.outputs.vendor }}](https://github.com/duckdb/duckdb/commit/${{ steps.vendor.outputs.vendor }})" >> body.txt
            gh pr edit vendoring \
             --title "${MSG}" \
             --body-file body.txt 
            gh pr comment vendoring \
             --body "${MSG}"
